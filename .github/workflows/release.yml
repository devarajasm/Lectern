name: Release

# Push a tag like v0.2.0 (scripts/release.sh does this) to publish a GitHub release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches VERSION and package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          v=$(cat VERSION)
          p=$(node -p "require('./frontend/package.json').version")
          echo "tag=$tag VERSION=$v package.json=$p"
          test "$tag" = "$v" && test "$tag" = "$p"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package (source + prebuilt UI, runs with Python only)
        run: |
          name="lectern-${GITHUB_REF_NAME}"
          git archive --format=tar --prefix="$name/" HEAD | tar -x
          cp -r frontend/dist "$name/frontend/dist"
          tar -czf "$name.tar.gz" "$name"
          (cd "$name" && zip -qr "../$name.zip" .)
          sha256sum "$name.tar.gz" "$name.zip" > SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || echo "See CHANGELOG.md" > RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "Lectern $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            $prerelease \
            "lectern-${GITHUB_REF_NAME}.tar.gz" "lectern-${GITHUB_REF_NAME}.zip" SHA256SUMS.txt
